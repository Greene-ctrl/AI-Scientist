name: Check file size
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Check large files
        uses: ppremk/lfs-warning@v3.3
        with:
          filesizelimit: 10485760 # 10MB
          token: ${{ secrets.GITHUB_TOKEN }}
